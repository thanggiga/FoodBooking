<!DOCTYPE html>
<html>
    <head>
    <title>FoodBooking-bought</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/bought.css">
        <link rel="shortcut icon" type="image/png" href="https://res.cloudinary.com/dhxabc6as/image/upload/v1750652035/web_logo_o0evny.png"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/7edc976cfd.js" crossorigin="anonymous"></script>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="stylesheet" href="css/footer.css">
    </head>
    <body>
        <!-- task-bar -->
        <div id="accountPopup" class="popup-account">
        <div class="popup-content">
            <span class="close-popup" onclick="closePopup()">&times;</span>
            <h2>Thông tin tài khoản đang đăng nhập</h2>
            <p><strong>Tên:</strong> <span id="userName">...</span></p>
            <p><strong>Email:</strong> <span id="userEmail">...</span></p>
        </div>
        </div>

        <a href="login.html" class="btn-logout"><i class='bx bx-log-out'></i></a>
        <button onclick="info()" class="btn-acc"><i class='bx bx-user-circle' ></i></button>
        <div class="taskbar">
            <a href="index.html"><img src="https://res.cloudinary.com/dhxabc6as/image/upload/v1750578758/BetterImage_1750578615095_hpjyos.jpg" alt="logo" class="logo"></a>
            <a href="product-search.html">
            <div class="search-container">
            <input class="find" type="text" placeholder="Find some food here!">
            <i class="fas fa-search search-icon"></i>
        </div>
        </a>
            <ul class="btn">
                <li><a href="about.html">Thông tin</a></li>
                <li><a href="product.html" class="Food">Sản phẩm</a></li>
                <li><a href="feedback.html">Liên hệ</a></li>
                <li><a href="basket.html">Giỏ hàng</a></li>
            </ul>
        </div>
        <!-- block of product -->
        <div class="products">
            <h2>Các sản phẩm bạn đã mua:</h2>
            <div class="purchased">Bạn chưa mua sản phẩm nào...</div>
            <div class="total-amount" 
            style="text-align: center; font-size: 24px; font-weight: bold;"></div>       
        </div>     
        <!-- footer -->
         <script type="module" src="js/firebase.js"></script>
        <script type="module" src="js/bought.js"></script>
<div id="customAlert" class="custom-alert" style="display:none;">
  <div class="custom-alert-box">
    <span id="customAlertMsg"></span>
    <button id="customAlertClose">Đóng</button>
  </div>
</div>
    </body>
    
    <div id="footer-placeholder"></div>
    <script>
        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    
</html>
