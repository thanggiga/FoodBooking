<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý tài khoản</title>
    <link
      rel="shortcut icon"
      type="image/png"
      href="https://res.cloudinary.com/dhxabc6as/image/upload/v1750652035/web_logo_o0evny.png"
    />
    <link rel="stylesheet" href="css/FoodBooking.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <!-- Taskbar -->
    <div class="taskbar">
      <a href="index.html"
        ><img
          src="https://res.cloudinary.com/dhxabc6as/image/upload/v1750578758/BetterImage_1750578615095_hpjyos.jpg"
          alt="logo"
          class="logo"
      /></a>
      <a href="product-search.html">
        <div class="search-container">
          <input
            class="find"
            type="text"
            placeholder="Lên FoodBooking tìm chút đồ ăn nào..."
          />
          <i class="fas fa-search search-icon"></i>
        </div>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Mở menu">
        <i class="bx bx-menu"></i>
      </button>
      <ul class="btn" id="nav-links">
        <li><a href="about.html" class="About">Thông tin</a></li>
        <li><a href="product.html" class="Food">Sản phẩm</a></li>
        <li><a href="feedback.html" class="contact">Liên hệ</a></li>
        <li><a href="basket.html" class="Basket">Giỏ hàng</a></li>
      </ul>
      <div class="mobile-menu" id="mobile-menu">
        <a href="about.html">Thông tin</a>
        <a href="product.html">Sản phẩm</a>
        <a href="feedback.html">Liên hệ</a>
        <a href="basket.html">Giỏ hàng</a>
        <a href="product-search.html">Tìm kiếm</a>
      </div>
    </div>
    <a href="login.html" id="btn-logout"><i class="bx bx-log-out"></i></a>
    <button class="btn-acc"><i class="bx bx-user-circle"></i></button>

    <div class="account-main">
      <div id="accountInfoBox" class="account-info-box">
        <h2>Thông tin tài khoản</h2>
        <p><strong>Tên:</strong> <span id="userName">...</span></p>
        <p><strong>Email:</strong> <span id="userEmail">...</span></p>
      </div>
      <div class="account-container">
        <h2>Quản lý tài khoản</h2>
        <form id="accountForm" autocomplete="off">
          <div class="form-title">Cài đặt tài khoản</div>
          <div class="form-group">
            <label for="displayName">Tên hiển thị</label>
            <input type="text" id="displayName" name="displayName" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <div id="email" class="email-static"></div>
            <div>
              <span>Email xác minh: </span><span id="verifyStatus"></span>
              <button id="btnCheckVerify" class="btn-check-verify" type="button">Kiểm tra xác minh</button>
            </div>
          </div>
          <div class="form-group">
            <label for="oldPassword">Mật khẩu cũ</label>
            <input type="password" id="oldPassword" name="oldPassword" placeholder="Nhập mật khẩu cũ của bạn" required />
          </div>
          <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Để trống nếu không đổi"
            />
          </div>
          <div class="form-actions">
            <button type="submit" id="btnSave">Lưu thay đổi</button>
            <button type="button" id="btnDelete" class="danger">
              Xóa tài khoản
            </button>
          </div>
          <div id="accountMessage"></div>
        </form>
      </div>
    </div>
    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/account.js"></script>
    <script>
      fetch("components/footer.html")
        .then((r) => r.text())
        .then((t) => {
          t = t.replace(
            /text-decoration: underline.*?;/g,
            "text-decoration: none;"
          );
          document.getElementById("footer-placeholder").innerHTML = t;
        });
    </script>
    <div id="customAlert" class="custom-alert" style="display: none">
      <div class="custom-alert-box">
        <span id="customAlertMsg"></span>
        <button id="customAlertClose">Đóng</button>
      </div>
    </div>
  </body>
</html>
